plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group 'fr.romitou.mongosk'
version '2.5.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    implementation group: 'org.mongodb', name: 'mongodb-driver-reactivestreams', version: '5.14.0'
    compileOnly group: 'io.papermc.paper', name: 'paper-api', version: '26.3.build.236-stable'
    compileOnly group: 'com.github.SkriptLang', name: 'Skript', version: '2.17.1', {
        exclude module: 'Vault'
        exclude module: 'worldguard'
        exclude module: 'worldguard-legacy'
    }

    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
    testImplementation 'com.google.code.findbugs:jsr305:3.0.2'
    testImplementation group: 'io.papermc.paper', name: 'paper-api', version: '26.3.build.236-stable'
    testImplementation group: 'com.github.SkriptLang', name: 'Skript', version: '2.17.1', {
        exclude module: 'Vault'
        exclude module: 'worldguard'
        exclude module: 'worldguard-legacy'
    }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

compileJava {
    // Skript 2.10, the oldest supported version, requires Java 17.
    options.compilerArgs += ['-source', '17', '-target', '17']
    options.encoding = 'UTF-8'
}

processResources {
    // Keep the version of the plugin.yml in sync with the project version.
    inputs.property 'version', project.version
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

shadowJar {
    // Remove all classes of dependencies that are not used by the project
    minimize()
    // Relocate dependencies in order to avoid conflicts with other plugins
    relocate 'com.mongodb', 'fr.romitou.mongosk.libs.driver'
    relocate 'org.bson', 'fr.romitou.mongosk.libs.bson'
    relocate 'org.reactivestreams', 'fr.romitou.mongosk.libs.reactivestreams'
    relocate 'reactor', 'fr.romitou.mongosk.libs.reactor'
}
