name: Build & Test
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Build and run unit tests with Gradle
        run: ./gradlew clean test shadowJar
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MongoSK
          path: build/libs/**

  test:
    runs-on: ubuntu-22.04
    needs: [build]
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
    strategy:
      fail-fast: false
      matrix:
        # The latest three stable versions of Skript, on the versions of Minecraft they support among the latest three.
        include:
          - { skript-version: '2.17.1', mc-version: '26.3' }
          - { skript-version: '2.17.1', mc-version: '26.2' }
          - { skript-version: '2.17.1', mc-version: '26.1' }
          - { skript-version: '2.16.2', mc-version: '26.2' }
          - { skript-version: '2.16.2', mc-version: '26.1' }
          - { skript-version: '2.15.4', mc-version: '26.1' }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: MongoSK
          path: build/libs
          
      - name: Install mongo-tools
        run: |
          wget https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.9.4.deb
          sudo dpkg -i mongodb-database-tools-ubuntu2204-x86_64-100.9.4.deb || sudo apt-get install -f -y

      - name: Import JSON fixture to MongoDB
        run: |
          mongoimport --host localhost --port 27017 --db testdb --collection players --file src/test/resources/fixtures/players.json

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Run tests with Skript ${{ matrix.skript-version }} on Minecraft ${{ matrix.mc-version }}
        run: .github/scripts/run-skript-tests.sh ${{ matrix.skript-version }} ${{ matrix.mc-version }} src/test/resources build/libs
