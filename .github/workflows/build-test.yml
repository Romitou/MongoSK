name: Build & Test
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build and run unit tests with Gradle
        run: ./gradlew clean test shadowJar
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MongoSK
          path: build/libs/**

  test:
    runs-on: ubuntu-22.04
    needs: [build]
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
    strategy:
      fail-fast: false
      matrix:
        skript-version: [2.15.3, 2.14.3, 2.13.2, 2.12.2, 2.11.2, 2.10.2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: MongoSK
          path: build/libs
          
      - name: Install mongo-tools
        run: |
          wget https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.9.4.deb
          sudo dpkg -i mongodb-database-tools-ubuntu2204-x86_64-100.9.4.deb || sudo apt-get install -f -y

      - name: Import JSON fixture to MongoDB
        run: |
          mongoimport --host localhost --port 27017 --db testdb --collection players --file src/test/resources/fixtures/players.json

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run tests with Skript ${{ matrix.skript-version }}
        run: .github/scripts/run-skript-tests.sh ${{ matrix.skript-version }} src/test/resources build/libs
